<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Judgment</title>
<style>
  :root {
    --bg:#eef1f5; --fg:#16181d; --muted:#5f6673; --card:#fff; --line:#dde1e7; --tile:#f5f7fa;
    --good:#1a7f37; --shaky:#9a6700; --cold:#0969da; --hot:#c4540a; --bad:#cf222e;
    --shadow:0 1px 2px rgb(0 0 0 / .05), 0 8px 24px rgb(0 0 0 / .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1115; --fg:#e8eaee; --muted:#9aa1ad; --card:#181b21; --line:#2a2f38; --tile:#20242b;
      --good:#3fb950; --shaky:#d29922; --cold:#58a6ff; --hot:#f0883e; --bad:#ff6b6b;
      --shadow:none;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
    font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:600px; margin:0 auto; padding:32px 16px 48px; }
  header { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; }
  h1 { font-size:1rem; font-weight:600; letter-spacing:.02em; margin:0; }
  #status { font-size:.85rem; color:var(--muted); margin:0; text-align:right; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:24px; margin-bottom:16px; box-shadow:var(--shadow); }

  #result { --tone:var(--muted); position:relative; overflow:hidden; border-top:6px solid var(--tone); }
  #result.good { --tone:var(--good); } #result.shaky { --tone:var(--shaky); }
  #result.cold, #result.cold-severe { --tone:var(--cold); }
  #result.hot, #result.hot-severe { --tone:var(--hot); }
  #result.bad { --tone:var(--bad); }
  #result::before { content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(160deg, color-mix(in srgb, var(--tone) 14%, transparent), transparent 55%); }
  #result.cold-severe::before, #result.hot-severe::before, #result.bad::before {
    background:linear-gradient(160deg, color-mix(in srgb, var(--tone) 28%, transparent), transparent 70%); }
  #result > * { position:relative; }

  .hero { display:flex; align-items:center; gap:16px; }
  .hero > div { flex:1; min-width:0; }
  #icon { font-size:56px; line-height:1; flex:none; }
  #place { margin:0; font-size:.9rem; color:var(--muted); }
  #verdict { margin:2px 0 0; font-size:clamp(2.2rem, 9vw, 3.2rem); font-weight:800; line-height:1.05;
    letter-spacing:-.02em; color:var(--tone); }
  #reason { margin:12px 0 0; font-size:1rem; }
  #forecast { margin:2px 0 0; color:var(--muted); font-size:.95rem; }

  #details { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-top:20px; }
  @media (max-width:420px) { #details { grid-template-columns:repeat(2, 1fr); } }
  .tile { background:var(--tile); border-radius:10px; padding:10px 12px; }
  .tile span { display:block; font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .tile b { font-size:1.25rem; font-weight:650; font-variant-numeric:tabular-nums; }

  #alerts:empty { display:none; }
  #alerts { margin-top:16px; display:flex; flex-direction:column; gap:8px; }
  .alert { border-left:4px solid var(--bad); background:color-mix(in srgb, var(--bad) 10%, transparent);
    border-radius:6px; padding:8px 12px; font-size:.9rem; }
  .alert.minor { border-color:var(--shaky); background:color-mix(in srgb, var(--shaky) 10%, transparent); }

  .loc h2 { font-size:.85rem; font-weight:600; color:var(--muted); margin:0 0 10px; }
  form { display:flex; gap:8px; flex-wrap:wrap; }
  input { flex:1 1 200px; min-width:0; padding:10px 12px; font:inherit; color:inherit;
    background:var(--tile); border:1px solid var(--line); border-radius:8px; }
  input:focus { outline:2px solid var(--cold); outline-offset:-1px; }
  button { padding:10px 18px; font:inherit; font-weight:600; color:#fff; background:var(--fg);
    border:0; border-radius:8px; cursor:pointer; }
  @media (prefers-color-scheme: dark) { button { color:var(--bg); } }
  button:hover { opacity:.88; }
  #matches:empty { display:none; }
  #matches { display:flex; flex-direction:column; gap:6px; margin-top:12px; }
  #matches button, button.secondary { text-align:left; font-weight:400; color:var(--fg); background:var(--tile);
    border:1px solid var(--line); }
  #locate { margin-top:8px; width:100%; text-align:center; }
  .status-row { display:flex; align-items:center; gap:8px; }
  #share { padding:2px 8px; font-size:.85rem; line-height:1.4; }
  #share[hidden] { display:none; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Weather Judgment</h1>
    <div class="status-row">
      <p id="status">Requesting your location…</p>
      <button id="share" type="button" class="secondary" title="Share current view" aria-label="Share current view" hidden>🔗</button>
    </div>
  </header>

  <div id="result" class="card" hidden>
    <div class="hero">
      <div>
        <p id="place"></p>
        <p id="verdict"></p>
      </div>
      <div id="icon" aria-hidden="true"></div>
    </div>
    <p id="reason"></p>
    <p id="forecast"></p>
    <div id="details"></div>
    <div id="alerts"></div>
  </div>

  <div class="card loc">
    <h2>Search a location</h2>
    <form id="search">
      <input id="query" type="search" placeholder="City, zip code, or lat, lon" autocomplete="off">
      <button>Search</button>
    </form>
    <button id="locate" type="button" class="secondary">📍 Use current location</button>
    <div id="matches"></div>
  </div>
</main>

<script>
const T = {
  minF: 55,
  maxF: 90,
  goodDewF: 60,
  goodRH: 65,
  goodPop: 20,
  coldCalmPop: 30,
  humidDewF: 70,
  heatIndexF: 95,
};
const STORM_WORDS = /thunderstorm|tornado|hurricane|tropical storm|blizzard/i;
const PRECIP_WORDS = /snow|sleet|ice|rain|shower|drizzle|freezing|storm|flurr|wintry/i;
const NON_STORM_ALERTS = /heat|cold|chill|freeze|frost|fire|red flag|air quality|dust|smoke/i;

const NWS = 'https://api.weather.gov';
const FORECAST = 'https://api.open-meteo.com/v1/forecast';
const GEOCODE = 'https://geocoding-api.open-meteo.com/v1/search';
const $ = id => document.getElementById(id);

// WMO weather codes used by Open-Meteo
const WMO = {
  0: ['Clear', '☀️'], 1: ['Mostly clear', '🌤️'], 2: ['Partly cloudy', '⛅'], 3: ['Overcast', '☁️'],
  45: ['Fog', '🌫️'], 48: ['Freezing fog', '🌫️'],
  51: ['Light drizzle', '🌦️'], 53: ['Drizzle', '🌦️'], 55: ['Heavy drizzle', '🌧️'],
  56: ['Light freezing drizzle', '🌧️'], 57: ['Freezing drizzle', '🌧️'],
  61: ['Light rain', '🌦️'], 63: ['Rain', '🌧️'], 65: ['Heavy rain', '🌧️'],
  66: ['Light freezing rain', '🌧️'], 67: ['Freezing rain', '🌧️'],
  71: ['Light snow', '🌨️'], 73: ['Snow', '🌨️'], 75: ['Heavy snow', '❄️'], 77: ['Snow grains', '🌨️'],
  80: ['Light rain showers', '🌦️'], 81: ['Rain showers', '🌧️'], 82: ['Violent rain showers', '🌧️'],
  85: ['Snow showers', '🌨️'], 86: ['Heavy snow showers', '❄️'],
  95: ['Thunderstorm', '⛈️'], 96: ['Thunderstorm with hail', '⛈️'], 99: ['Thunderstorm with heavy hail', '⛈️'],
};

async function getJSON(url, headers = {}, retries = 1) {
  const res = await fetch(url, { headers });
  if (res.ok) return res.json();
  if (res.status >= 500 && retries > 0) return getJSON(url, headers, retries - 1);
  const err = new Error(`${res.status} from ${new URL(url).host}`);
  err.status = res.status;
  throw err;
}

const nws = url => getJSON(url, { Accept: 'application/geo+json' });

function localTime(unixSeconds, timeZone) {
  const date = new Date(unixSeconds * 1000);
  const fmt = timeZoneName => new Intl.DateTimeFormat('en-US', { timeZone, hour: 'numeric', minute: '2-digit', timeZoneName }).format(date);
  const short = fmt('short');
  return /GMT|UTC/.test(short) ? fmt('long') : short;
}

const compass = deg => ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(deg / 45) % 8];

// NWS returns 400/404 outside the US
async function nwsAlerts(lat, lon) {
  try {
    return (await nws(`${NWS}/alerts/active?point=${lat},${lon}`)).features.map(f => f.properties);
  } catch (e) {
    return e.status === 400 || e.status === 404 ? [] : null;
  }
}

async function nwsPlace(lat, lon) {
  try {
    const loc = (await nws(`${NWS}/points/${lat},${lon}`)).properties.relativeLocation.properties;
    return `${loc.city}, ${loc.state}`;
  } catch {
    return null;
  }
}

function heatIndex(t, rh) {
  if (t < 80 || rh == null) return t;
  return -42.379 + 2.04901523 * t + 10.14333127 * rh - 0.22475541 * t * rh
    - 0.00683783 * t * t - 0.05481717 * rh * rh + 0.00122874 * t * t * rh
    + 0.00085282 * t * rh * rh - 0.00000199 * t * t * rh * rh;
}

function classify(w, stormAlerts) {
  const { tempF, dewF, rh, pop, hi, text } = w;
  const dew = dewF ?? -Infinity;
  const hum = rh ?? 0;

  if (stormAlerts.length) return ['BAD', 'bad', `Active alert: ${stormAlerts.map(a => a.event).join(', ')}`];
  if (STORM_WORDS.test(text)) return ['BAD', 'bad', `Forecast: ${text}`];

  if (hi >= T.heatIndexF || (tempF > T.maxF && dew > T.humidDewF))
    return ['Bad (Hot)', 'hot-severe', 'Extreme heat and/or humidity'];

  if (tempF < T.minF) {
    if (pop > T.coldCalmPop || PRECIP_WORDS.test(text))
      return ['Bad (Cold)', 'cold-severe', 'Cold with precipitation'];
    return ['bad (Cold)', 'cold', 'Cold but calm'];
  }

  if (tempF > T.maxF) return ['bad (Hot)', 'hot', pop > T.coldCalmPop ? 'Hot, some chance of rain' : 'Hot but calm'];

  const issues = [];
  if (dew > T.goodDewF) issues.push('high dew point');
  if (hum > T.goodRH) issues.push('high humidity');
  if (pop > T.goodPop) issues.push('chance of rain');
  if (issues.length) return ['Shaky', 'shaky', `Comfortable temperature, but ${issues.join(', ')}`];
  return ['Good', 'good', 'Moderate temperature, dry, low chance of rain'];
}

async function run(lat, lon, placeName, fromDevice = false) {
  lat = Number(lat).toFixed(4);
  lon = Number(lon).toFixed(4);
  $('status').textContent = `Loading weather for ${lat}, ${lon}…`;
  $('result').hidden = true;
  $('share').hidden = true;

  try {
    const vars = 'temperature_2m,relative_humidity_2m,dew_point_2m,precipitation_probability,weather_code,wind_speed_10m,wind_direction_10m';
    const [forecast, allAlerts, place] = await Promise.all([
      getJSON(`${FORECAST}?latitude=${lat}&longitude=${lon}&current=${vars}&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto&timeformat=unixtime`),
      nwsAlerts(lat, lon),
      placeName ?? nwsPlace(lat, lon),
    ]);

    const c = forecast.current;
    const tempF = c.temperature_2m;
    const dewF = c.dew_point_2m ?? null;
    const rh = c.relative_humidity_2m ?? null;
    const pop = c.precipitation_probability ?? 0;
    const [text, icon] = WMO[c.weather_code] ?? ['Unknown conditions', ''];
    const w = { tempF, dewF, rh, pop, hi: heatIndex(tempF, rh), text };

    const stormAlerts = (allAlerts ?? []).filter(a =>
      (a.severity === 'Severe' || a.severity === 'Extreme') && !NON_STORM_ALERTS.test(a.event));

    const [label, cls, reason] = classify(w, stormAlerts);

    $('place').textContent = place ?? `${lat}, ${lon}`;
    $('verdict').textContent = label.replace(/ \((Cold|Hot)\)$/, '');
    $('result').className = `card ${cls}`;
    $('reason').textContent = reason;
    $('forecast').textContent = text;
    $('icon').textContent = icon;

    const rows = [
      ['Temp', `${Math.round(tempF)}°F`],
      ['Feels like', `${Math.round(w.hi)}°F`],
      ['Dew point', dewF == null ? 'n/a' : `${Math.round(dewF)}°F`],
      ['Humidity', rh == null ? 'n/a' : `${rh}%`],
      ['Precip', `${pop}%`],
      ['Wind', `${Math.round(c.wind_speed_10m)} mph ${compass(c.wind_direction_10m)}`],
    ];
    $('details').replaceChildren(...rows.map(([k, v]) => {
      const tile = document.createElement('div');
      tile.className = 'tile';
      const name = document.createElement('span'); name.textContent = k;
      const value = document.createElement('b'); value.textContent = v;
      tile.append(name, value);
      return tile;
    }));

    $('alerts').replaceChildren(...(allAlerts ?? []).map(a => {
      const div = document.createElement('div');
      div.className = stormAlerts.includes(a) ? 'alert' : 'alert minor';
      div.textContent = `${a.event} (${a.severity})`;
      return div;
    }));

    $('status').textContent = `Current conditions as of ${localTime(c.time, forecast.timezone)}`
      + (allAlerts === null ? ' · NWS alerts unavailable' : '');
    $('result').hidden = false;

    const params = fromDevice ? null : new URLSearchParams({ lat, lon });
    if (params && placeName) params.set('name', placeName);
    history.replaceState(null, '', params ? `?${params}` : location.pathname);

    shareParams = new URLSearchParams({ lat, lon });
    if (place) shareParams.set('name', place);
    $('share').hidden = false;
  } catch (e) {
    $('status').textContent = `Error: ${e.message}`;
  }
}

async function search(q) {
  $('matches').replaceChildren();
  const coords = q.match(/^\s*(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)\s*$/);
  if (coords) return run(coords[1], coords[2]);

  $('status').textContent = `Searching for "${q}"…`;
  let results;
  try {
    const url = `${GEOCODE}?count=5&language=en&format=json&name=${encodeURIComponent(q)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`${res.status} from location search`);
    results = (await res.json()).results ?? [];
  } catch (e) {
    $('status').textContent = `Error: ${e.message}`;
    return;
  }

  if (!results.length) {
    $('status').textContent = `No locations found for "${q}".`;
    return;
  }
  const shortName = r => [r.name, r.admin1, r.country_code === 'US' ? null : r.country].filter(Boolean).join(', ');
  if (results.length === 1) return run(results[0].latitude, results[0].longitude, shortName(results[0]));

  $('status').textContent = 'Multiple matches. Pick one.';
  $('matches').replaceChildren(...results.map(r => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = [r.name, r.admin2, r.admin1, r.country].filter(Boolean).join(', ');
    b.addEventListener('click', () => {
      $('matches').replaceChildren();
      run(r.latitude, r.longitude, shortName(r));
    });
    return b;
  }));
}

$('search').addEventListener('submit', e => {
  e.preventDefault();
  const q = $('query').value.trim();
  if (q) search(q);
});

function locate() {
  if (!('geolocation' in navigator)) {
    $('status').textContent = 'Geolocation not supported. Search for a location below.';
    return;
  }
  $('matches').replaceChildren();
  $('status').textContent = 'Requesting your location…';
  navigator.geolocation.getCurrentPosition(
    pos => run(pos.coords.latitude, pos.coords.longitude, undefined, true),
    err => { $('status').textContent = `Location unavailable (${err.message}). Search for a location below.`; },
    { timeout: 10000 },
  );
}

$('locate').addEventListener('click', locate);

let shareParams = null;
$('share').addEventListener('click', async () => {
  if (!shareParams) return;
  const url = `${location.origin}${location.pathname}?${shareParams}`;
  if (navigator.share) {
    try { await navigator.share({ title: document.title, url }); } catch {}
    return;
  }
  try {
    await navigator.clipboard.writeText(url);
    $('share').textContent = '✓';
    setTimeout(() => { $('share').textContent = '🔗'; }, 2000);
  } catch {
    prompt('Copy this link:', url);
  }
});

const initial = new URLSearchParams(location.search);
const initLat = parseFloat(initial.get('lat')), initLon = parseFloat(initial.get('lon'));
if (Number.isFinite(initLat) && Number.isFinite(initLon)) run(initLat, initLon, initial.get('name') ?? undefined);
else locate();
</script>
</body>
</html>
